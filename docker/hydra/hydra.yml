serve:
  public:
    port: 4444
    host: 0.0.0.0
  admin:
    port: 4445
    host: 0.0.0.0

# 開発モード有効化（本番では削除）
dev: true

dsn: mysql://sso_user:sso_password@db:3306/hydra_development?parseTime=true

urls:
  self:
    issuer: http://localhost:4444
  login: http://localhost:3000/oauth2/login
  consent: http://localhost:3000/oauth2/consent
  logout: http://localhost:3000/oauth2/logout
  post_logout_redirect: http://localhost:3000/

secrets:
  system:
    - hydra-system-secret-change-this-in-production

oidc:
  subject_identifiers:
    supported_types:
      - public
    pairwise:
      salt: hydra-salt-change-this-in-production

oauth2:
  expose_internal_errors: true